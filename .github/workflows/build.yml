name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_FLAGS: -trimpath
  CGO_ENABLED: '0'

jobs:
  build:
    name: Test and cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JS tests
        run: node test/run.js

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Go tests
        run: |
          go vet ./...
          go test -v ./...

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Cross-compile
        run: |
          mkdir -p bin dist
          for t in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 android/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            echo "building $t"
            GOOS=$os GOARCH=$arch go build $GO_FLAGS -ldflags "-s -w -X main.version=$VERSION" \
              -o "bin/minimaj-$os-$arch$ext" ./server
          done
          ls -l bin

      - name: Package Windows and Linux
        run: |
          stage=$(mktemp -d)
          cp bin/minimaj-windows-amd64.exe "$stage/minimaj.exe"
          (cd "$stage" && zip -9 "$GITHUB_WORKSPACE/dist/minimaj-windows-amd64.zip" minimaj.exe)
          for arch in amd64 arm64; do
            rm -f "$stage/minimaj" && cp "bin/minimaj-linux-$arch" "$stage/minimaj" && chmod +x "$stage/minimaj"
            tar -C "$stage" -czf "dist/minimaj-linux-$arch.tar.gz" minimaj
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: bin
          path: bin/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dist-desktop
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS app
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: bin
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          echo "APPVER=$v" >> "$GITHUB_ENV"
      - name: Build minimaj.app
        run: |
          set -euo pipefail
          mkdir -p dist
          lipo -create -output minimaj-universal bin/minimaj-darwin-amd64 bin/minimaj-darwin-arm64
          chmod +x minimaj-universal
          lipo -info minimaj-universal

          app=minimaj.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp minimaj-universal "$app/Contents/MacOS/minimaj-server"
          # Launcher: a double-clicked app has no terminal, so log to a file.
          # The server opens the browser itself; "Stop server" in the game quits it.
          cat > "$app/Contents/MacOS/minimaj" <<'SH'
          #!/bin/sh
          dir="$(cd "$(dirname "$0")" && pwd)"
          log="$HOME/Library/Logs/minimaj.log"
          mkdir -p "$(dirname "$log")"
          exec "$dir/minimaj-server" >>"$log" 2>&1
          SH
          chmod +x "$app/Contents/MacOS/minimaj"

          # Icon from assets/icon.svg (best effort).
          icon_key=""
          if [ -f assets/icon.svg ] && qlmanage -t -s 1024 -o . assets/icon.svg >/dev/null 2>&1 && [ -f icon.svg.png ]; then
            mkdir -p minimaj.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s icon.svg.png --out minimaj.iconset/icon_${s}x${s}.png >/dev/null
              sips -z $((s*2)) $((s*2)) icon.svg.png --out minimaj.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns minimaj.iconset -o "$app/Contents/Resources/minimaj.icns" && icon_key="<key>CFBundleIconFile</key><string>minimaj</string>"
          fi

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>minimaj</string>
            <key>CFBundleDisplayName</key><string>minimaj</string>
            <key>CFBundleIdentifier</key><string>app.minimaj</string>
            <key>CFBundleExecutable</key><string>minimaj</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${APPVER}</string>
            <key>CFBundleShortVersionString</key><string>${APPVER}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
            ${icon_key}
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

          # Ad-hoc signature (required for arm64; the app is not notarized).
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$app"

          ditto -c -k --keepParent "$app" dist/minimaj-macos.zip
          stage=$(mktemp -d)
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname minimaj -srcfolder "$stage" -ov -format UDZO dist/minimaj-macos.dmg
          # Plain universal binary for terminal use.
          cp minimaj-universal minimaj && tar -czf dist/minimaj-macos-universal.tar.gz minimaj
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  android:
    name: Android APK
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: bin
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp bin/minimaj-android-arm64 android/app/src/main/jniLibs/arm64-v8a/libminimaj.so
          gradle -p android assembleDebug -PversionName="$v" -PversionCode="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/minimaj-android-arm64.apk
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
