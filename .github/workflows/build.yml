name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_FLAGS: -trimpath
  CGO_ENABLED: '0'

jobs:
  build:
    name: Test and cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JS tests
        run: node test/run.js

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Go tests
        run: |
          go vet ./...
          go test -v ./...

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Cross-compile
        run: |
          mkdir -p bin dist
          for t in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 android/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            echo "building $t"
            GOOS=$os GOARCH=$arch go build $GO_FLAGS -ldflags "-s -w -X main.version=$VERSION" \
              -o "bin/minimaj-$os-$arch$ext" ./server
          done
          ls -l bin

      - name: Package Windows and Linux
        run: |
          stage=$(mktemp -d)
          cp bin/minimaj-windows-amd64.exe "$stage/minimaj.exe"
          (cd "$stage" && zip -9 "$GITHUB_WORKSPACE/dist/minimaj-windows-amd64.zip" minimaj.exe)
          for arch in amd64 arm64; do
            rm -f "$stage/minimaj" && cp "bin/minimaj-linux-$arch" "$stage/minimaj" && chmod +x "$stage/minimaj"
            tar -C "$stage" -czf "dist/minimaj-linux-$arch.tar.gz" minimaj
          done
          ls -l dist

      - name: Package macOS app (universal, built on Linux)
        run: |
          if ! ls /usr/bin/llvm-lipo* >/dev/null 2>&1 && ! command -v llvm-lipo >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq llvm
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then appver="${GITHUB_REF_NAME#v}"; else appver="0.0.0"; fi
          sh scripts/package-macos.sh bin/minimaj-darwin-amd64 bin/minimaj-darwin-arm64 "$appver" dist-macos

      - uses: actions/upload-artifact@v7
        with:
          name: bin
          path: bin/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dist-desktop
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist-macos/
          if-no-files-found: error

  android:
    name: Android APK
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: bin
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp bin/minimaj-android-arm64 android/app/src/main/jniLibs/arm64-v8a/libminimaj.so
          gradle -p android assembleDebug -PversionName="$v" -PversionCode="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/minimaj-android-arm64.apk
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
