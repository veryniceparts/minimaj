<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>minimaj</title>
  <meta name="description" content="Minimal riichi mahjong for 1-4 players. Play on your local network or online with friends; empty seats are filled by computer players.">
  <meta name="theme-color" content="#1b1726">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <!-- "Add to Home Screen" opens minimaj like an app: full screen, no browser bars or tabs -->
  <link rel="manifest" href="assets/manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="minimaj">
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem('minimaj-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <main id="app" class="home"></main>
  <button id="fsbtn" aria-label="Full screen" title="Full screen" hidden></button>
  <button id="menubtn" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="menu" hidden></button>
  <div id="menu" role="dialog" aria-label="Settings" hidden></div>
  <div id="banner" role="status" hidden></div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
